name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Qt & Android SDK
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Configure CMake
      run: |
        qt-cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DQT_ANDROID_BUILD_ALL_TARGETS=ON

    - name: Build APK Target
      run: cmake --build build --target appmusleh_prepare_apk_dir appmusleh_make_apk || cmake --build build --target apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: appmusleh-apk
        path: build/**/*.apk
